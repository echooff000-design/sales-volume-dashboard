name: Keep Streamlit App Alive

on:
  schedule:
    # Runs every day at 06:00 and 18:00 UTC
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit Dashboard
        run: |
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/115.0.0.0 Safari/537.36" \
            "https://wbsale.streamlit.app" -o /dev/null -w "HTTP Response Code: %{http_code}\n"
