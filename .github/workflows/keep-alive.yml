name: Keep Streamlit App Alive

on:
  schedule:
    # Runs every 6 hours (adjust cron as desired)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit Dashboard
        run: |
          # Ping the main URL and Streamlit health endpoint without infinite redirects
          STATUS_CODE=$(curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            --max-redirs 5 \
            -o /dev/null -w "%{http_code}" \
            "https://wbsale.streamlit.app/_stcore/health" || true)

          echo "Ping executed successfully. HTTP Status: $STATUS_CODE"
